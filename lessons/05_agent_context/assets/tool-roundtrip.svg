<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="840" viewBox="0 0 1000 840" role="img" aria-labelledby="title desc">
<title id="title">工具调用前后的上下文变化</title><desc id="desc">第一次请求产生读取请求，harness 执行读取，第二次请求保留原任务、调用请求与真实结果，然后模型根据文件内容总结。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#61718a"/></marker></defs>
<rect width="1000" height="840" fill="#ffffff"/><g font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif"><text x="500" y="48" text-anchor="middle" font-size="30" fill="#172b4d"><tspan x="500" dy="0">一次工具调用，带来一次上下文更新</tspan></text><text x="245" y="103" text-anchor="middle" font-size="25" fill="#172b4d"><tspan x="245" dy="0">第一次请求</tspan></text><rect x="40" y="125" width="410" height="195" rx="14" fill="#eef4ff" stroke="#5577b2" stroke-width="2"/><text x="245" y="179.5" text-anchor="middle" font-size="23" fill="#172b4d"><tspan x="245" dy="0">系统要求 + 工具定义</tspan><tspan x="245" dy="34">用户任务：总结 notes.txt</tspan><tspan x="245" dy="34"></tspan><tspan x="245" dy="34">此时尚未获得文件内容</tspan></text><rect x="40" y="385" width="410" height="100" rx="14" fill="#eef4ff" stroke="#5577b2" stroke-width="2"/><text x="245" y="426" text-anchor="middle" font-size="23" fill="#172b4d"><tspan x="245" dy="0">第一次模型调用</tspan><tspan x="245" dy="34">请求 read_file(notes.txt)</tspan></text><rect x="40" y="550" width="410" height="100" rx="14" fill="#fff6e8" stroke="#b78942" stroke-width="2"/><text x="245" y="591" text-anchor="middle" font-size="23" fill="#172b4d"><tspan x="245" dy="0">harness 执行工具</tspan><tspan x="245" dy="34">读取文件，取得真实内容</tspan></text><path d="M245 325 V375" fill="none" stroke="#61718a" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M245 490 V540" fill="none" stroke="#61718a" stroke-width="2.5" marker-end="url(#arrow)"/><text x="755" y="103" text-anchor="middle" font-size="25" fill="#172b4d"><tspan x="755" dy="0">第二次请求</tspan></text><rect x="550" y="125" width="410" height="265" rx="14" fill="#edfaf4" stroke="#418269" stroke-width="2"/><text x="755" y="197.5" text-anchor="middle" font-size="23" fill="#172b4d"><tspan x="755" dy="0">保留原有系统要求、工具与任务</tspan><tspan x="755" dy="34"></tspan><tspan x="755" dy="34">+ 模型的读取请求</tspan><tspan x="755" dy="34">  调用 ID：call_read_001</tspan><tspan x="755" dy="34">+ 对应的真实读取结果</tspan></text><rect x="550" y="485" width="410" height="110" rx="14" fill="#edfaf4" stroke="#418269" stroke-width="2"/><text x="755" y="531" text-anchor="middle" font-size="23" fill="#172b4d"><tspan x="755" dy="0">第二次模型调用</tspan><tspan x="755" dy="34">根据实际文件内容生成总结</tspan></text><path d="M455 600 H500 V260 H540" fill="none" stroke="#61718a" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M755 395 V475" fill="none" stroke="#61718a" stroke-width="2.5" marker-end="url(#arrow)"/><text x="755" y="438" text-anchor="middle" font-size="21" fill="#52627a"><tspan x="755" dy="0">模型有了新的观察依据</tspan></text><rect x="40" y="710" width="920" height="90" rx="12" fill="#f3f6fa"/><text x="500" y="746" text-anchor="middle" font-size="22" fill="#52627a"><tspan x="500" dy="0">请求记录说明“打算做什么”，工具结果说明“实际发生什么”。</tspan><tspan x="500" dy="34">图示仅展示读取与总结，不是第三课完整运行轨迹。</tspan></text></g></svg>
