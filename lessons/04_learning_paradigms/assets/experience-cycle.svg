<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="645" viewBox="0 0 1000 645" role="img" aria-labelledby="title desc">
<title id="title">外部经验改进循环</title><desc id="desc">发现问题、提炼经验、验证经验、持久保存、后续复用、检查效果，再根据结果继续改进。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#61718a"/></marker></defs>
<rect width="1000" height="645" fill="#ffffff"/>
<g font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif"><text x="500" y="48" text-anchor="middle" font-size="29" fill="#172b4d"><tspan x="500" dy="0">外部经验改进循环：保存之后还要复用</tspan></text><text x="500" y="89" text-anchor="middle" font-size="21" fill="#52627a"><tspan x="500" dy="0">这是一套待设计的流程，可以由人、程序或 Agent 分工完成。</tspan></text><rect x="45" y="140" width="260" height="110" rx="14" fill="#eef4ff" stroke="#5577b2" stroke-width="2"/><text x="175" y="186" text-anchor="middle" font-size="23" fill="#172b4d"><tspan x="175" dy="0">1 发现问题</tspan><tspan x="175" dy="34">写入失败却宣称成功</tspan></text><rect x="370" y="140" width="260" height="110" rx="14" fill="#eef4ff" stroke="#5577b2" stroke-width="2"/><text x="500" y="186" text-anchor="middle" font-size="23" fill="#172b4d"><tspan x="500" dy="0">2 提炼经验</tspan><tspan x="500" dy="34">通知必须依据成功结果</tspan></text><rect x="695" y="140" width="260" height="110" rx="14" fill="#eef4ff" stroke="#5577b2" stroke-width="2"/><text x="825" y="186" text-anchor="middle" font-size="23" fill="#172b4d"><tspan x="825" dy="0">3 验证经验</tspan><tspan x="825" dy="34">检查成功与失败场景</tspan></text><rect x="695" y="370" width="260" height="110" rx="14" fill="#eef4ff" stroke="#5577b2" stroke-width="2"/><text x="825" y="416" text-anchor="middle" font-size="23" fill="#172b4d"><tspan x="825" dy="0">4 持久保存</tspan><tspan x="825" dy="34">规则文件 / 工具代码</tspan></text><rect x="370" y="370" width="260" height="110" rx="14" fill="#eef4ff" stroke="#5577b2" stroke-width="2"/><text x="500" y="416" text-anchor="middle" font-size="23" fill="#172b4d"><tspan x="500" dy="0">5 后续复用</tspan><tspan x="500" dy="34">读取规则或执行代码</tspan></text><rect x="45" y="370" width="260" height="110" rx="14" fill="#eef4ff" stroke="#5577b2" stroke-width="2"/><text x="175" y="416" text-anchor="middle" font-size="23" fill="#172b4d"><tspan x="175" dy="0">6 检查效果</tspan><tspan x="175" dy="34">是否减少同类错误？</tspan></text><path d="M310 195 H360" fill="none" stroke="#61718a" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M635 195 H685" fill="none" stroke="#61718a" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M825 255 V360" fill="none" stroke="#61718a" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M685 425 H640" fill="none" stroke="#61718a" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M360 425 H315" fill="none" stroke="#61718a" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M175 360 V260" fill="none" stroke="#61718a" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#arrow)"/><text x="190" y="310" text-anchor="middle" font-size="20" fill="#52627a"><tspan x="190" dy="0">仍有问题，继续改进</tspan></text><rect x="45" y="530" width="910" height="75" rx="12" fill="#fff6e8"/><text x="500" y="573" text-anchor="middle" font-size="23" fill="#77511e"><tspan x="500" dy="0">只保存日志，没有提炼、验证与复用，不等于完成学习闭环。</tspan></text></g></svg>
