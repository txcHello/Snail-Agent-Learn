<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="610" viewBox="0 0 1000 610" role="img" aria-labelledby="title desc">
<title id="title">三种学习方式对照</title><desc id="desc">三行流程分别展示后训练更新参数、上下文学习利用当前输入、外部化学习保存并复用外部经验。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#61718a"/></marker></defs>
<rect width="1000" height="610" fill="#ffffff"/>
<g font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif"><text x="500" y="48" text-anchor="middle" font-size="30" fill="#172b4d"><tspan x="500" dy="0">三种学习方式：经验保存在哪里？</tspan></text><text x="285" y="100" text-anchor="middle" font-size="21" fill="#52627a"><tspan x="285" dy="0">提供什么</tspan></text><text x="565" y="100" text-anchor="middle" font-size="21" fill="#52627a"><tspan x="565" dy="0">改变什么</tspan></text><text x="845" y="100" text-anchor="middle" font-size="21" fill="#52627a"><tspan x="845" dy="0">下一次如何使用</tspan></text><text x="77" y="175" text-anchor="middle" font-size="23" fill="#5577b2"><tspan x="77" dy="0">后训练</tspan></text><rect x="180" y="130" width="210" height="90" rx="14" fill="#eef4ff" stroke="#5577b2" stroke-width="2"/><text x="285" y="183" text-anchor="middle" font-size="23" fill="#172b4d"><tspan x="285" dy="0">案例 / 奖励信号</tspan></text><rect x="460" y="130" width="210" height="90" rx="14" fill="#eef4ff" stroke="#5577b2" stroke-width="2"/><text x="565" y="166" text-anchor="middle" font-size="23" fill="#172b4d"><tspan x="565" dy="0">训练更新</tspan><tspan x="565" dy="34">模型参数</tspan></text><rect x="740" y="130" width="210" height="90" rx="14" fill="#eef4ff" stroke="#5577b2" stroke-width="2"/><text x="845" y="183" text-anchor="middle" font-size="23" fill="#172b4d"><tspan x="845" dy="0">使用训练后模型</tspan></text><path d="M395 175 H450" fill="none" stroke="#61718a" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M675 175 H730" fill="none" stroke="#61718a" stroke-width="2.5" marker-end="url(#arrow)"/><text x="180" y="253" text-anchor="start" font-size="20" fill="#52627a"><tspan x="180" dy="0">参数承载训练效果；是否提升，需要评估。</tspan></text><text x="77" y="335" text-anchor="middle" font-size="23" fill="#418269"><tspan x="77" dy="0">上下文</tspan><tspan x="77" dy="34">学习</tspan></text><rect x="180" y="290" width="210" height="90" rx="14" fill="#edfaf4" stroke="#418269" stroke-width="2"/><text x="285" y="343" text-anchor="middle" font-size="23" fill="#172b4d"><tspan x="285" dy="0">本次示例 + 任务</tspan></text><rect x="460" y="290" width="210" height="90" rx="14" fill="#edfaf4" stroke="#418269" stroke-width="2"/><text x="565" y="326" text-anchor="middle" font-size="23" fill="#172b4d"><tspan x="565" dy="0">利用上下文适应</tspan><tspan x="565" dy="34">参数不更新</tspan></text><rect x="740" y="290" width="210" height="90" rx="14" fill="#edfaf4" stroke="#418269" stroke-width="2"/><text x="845" y="326" text-anchor="middle" font-size="23" fill="#172b4d"><tspan x="845" dy="0">再次提供</tspan><tspan x="845" dy="34">相关上下文</tspan></text><path d="M395 335 H450" fill="none" stroke="#61718a" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M675 335 H730" fill="none" stroke="#61718a" stroke-width="2.5" marker-end="url(#arrow)"/><text x="180" y="413" text-anchor="start" font-size="20" fill="#52627a"><tspan x="180" dy="0">信息是否可用，取决于本次请求实际包含的上下文。</tspan></text><text x="77" y="495" text-anchor="middle" font-size="23" fill="#b78942"><tspan x="77" dy="0">外部化</tspan><tspan x="77" dy="34">学习</tspan></text><rect x="180" y="450" width="210" height="90" rx="14" fill="#fff6e8" stroke="#b78942" stroke-width="2"/><text x="285" y="503" text-anchor="middle" font-size="23" fill="#172b4d"><tspan x="285" dy="0">验证后的经验</tspan></text><rect x="460" y="450" width="210" height="90" rx="14" fill="#fff6e8" stroke="#b78942" stroke-width="2"/><text x="565" y="486" text-anchor="middle" font-size="23" fill="#172b4d"><tspan x="565" dy="0">保存规则 / 知识</tspan><tspan x="565" dy="34">或工具代码</tspan></text><rect x="740" y="450" width="210" height="90" rx="14" fill="#fff6e8" stroke="#b78942" stroke-width="2"/><text x="845" y="486" text-anchor="middle" font-size="23" fill="#172b4d"><tspan x="845" dy="0">检索、读取</tspan><tspan x="845" dy="34">或执行</tspan></text><path d="M395 495 H450" fill="none" stroke="#61718a" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M675 495 H730" fill="none" stroke="#61718a" stroke-width="2.5" marker-end="url(#arrow)"/><text x="180" y="573" text-anchor="start" font-size="20" fill="#52627a"><tspan x="180" dy="0">持久保存之后，还需要在后续任务中用起来。</tspan></text></g></svg>
