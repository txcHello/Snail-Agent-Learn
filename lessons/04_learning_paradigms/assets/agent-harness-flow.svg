<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="770" viewBox="0 0 1000 770" role="img" aria-labelledby="title desc">
<title id="title">训练、上下文、外部知识与 harness 协作</title><desc id="desc">训练提供模型能力，外部规则加入本次上下文，模型请求工具，harness 执行并反馈。建议加入独立产物检查，只有通过才允许成功通知；这是设计示意，并非现有代码已实现。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#61718a"/></marker></defs>
<rect width="1000" height="770" fill="#ffffff"/>
<g font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif"><text x="500" y="45" text-anchor="middle" font-size="29" fill="#172b4d"><tspan x="500" dy="0">三种方式如何进入 Agent 的执行流程</tspan></text><rect x="35" y="85" width="285" height="100" rx="14" fill="#eef4ff" stroke="#5577b2" stroke-width="2"/><text x="177.5" y="126" text-anchor="middle" font-size="23" fill="#172b4d"><tspan x="177.5" dy="0">此前的训练与后训练</tspan><tspan x="177.5" dy="34">提供模型能力</tspan></text><rect x="680" y="85" width="285" height="100" rx="14" fill="#fff6e8" stroke="#b78942" stroke-width="2"/><text x="822.5" y="126" text-anchor="middle" font-size="23" fill="#172b4d"><tspan x="822.5" dy="0">外部知识 / 规则库</tspan><tspan x="822.5" dy="34">保存经过验证的经验</tspan></text><rect x="680" y="240" width="285" height="100" rx="14" fill="#edfaf4" stroke="#418269" stroke-width="2"/><text x="822.5" y="281" text-anchor="middle" font-size="23" fill="#172b4d"><tspan x="822.5" dy="0">本次任务 + 示例</tspan><tspan x="822.5" dy="34">+ 检索到的相关规则</tspan></text><rect x="35" y="240" width="285" height="100" rx="14" fill="#eef4ff" stroke="#5577b2" stroke-width="2"/><text x="177.5" y="281" text-anchor="middle" font-size="23" fill="#172b4d"><tspan x="177.5" dy="0">模型依据当前上下文</tspan><tspan x="177.5" dy="34">提出工具调用</tspan></text><path d="M177 190 V230" fill="none" stroke="#61718a" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M822 190 V230" fill="none" stroke="#61718a" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M670 290 H330" fill="none" stroke="#61718a" stroke-width="2.5" marker-end="url(#arrow)"/><text x="500" y="274" text-anchor="middle" font-size="20" fill="#52627a"><tspan x="500" dy="0">组织上下文</tspan></text><rect x="35" y="405" width="285" height="100" rx="14" fill="#eef4ff" stroke="#5577b2" stroke-width="2"/><text x="177.5" y="446" text-anchor="middle" font-size="23" fill="#172b4d"><tspan x="177.5" dy="0">harness 执行工具</tspan><tspan x="177.5" dy="34">读取 / 写入 / 返回结果</tspan></text><path d="M177 345 V395" fill="none" stroke="#61718a" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M35 457 H15 V290 H25" fill="none" stroke="#61718a" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#arrow)"/><text x="395" y="375" text-anchor="middle" font-size="20" fill="#52627a"><tspan x="395" dy="0">实际结果反馈给模型</tspan></text><path d="M495 390 L650 455 L495 520 L340 455 Z" fill="#fff6e8" stroke="#b78942" stroke-width="2"/><text x="495" y="447" text-anchor="middle" font-size="23" fill="#172b4d"><tspan x="495" dy="0">产物检查</tspan><tspan x="495" dy="34">通过？</tspan></text><path d="M325 455 H330" fill="none" stroke="#61718a" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M660 455 H695" fill="none" stroke="#61718a" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="705" y="405" width="260" height="100" rx="14" fill="#edfaf4" stroke="#418269" stroke-width="2"/><text x="835" y="446" text-anchor="middle" font-size="23" fill="#172b4d"><tspan x="835" dy="0">允许成功通知</tspan><tspan x="835" dy="34">告知真实产物位置</tspan></text><text x="680" y="438" text-anchor="middle" font-size="20" fill="#418269"><tspan x="680" dy="0">是</tspan></text><rect x="365" y="580" width="260" height="85" rx="14" fill="#fff0f0" stroke="#ab6565" stroke-width="2"/><text x="495" y="613.5" text-anchor="middle" font-size="23" fill="#172b4d"><tspan x="495" dy="0">记录 / 反馈失败</tspan><tspan x="495" dy="34">修正后重新执行</tspan></text><path d="M495 525 V570" fill="none" stroke="#61718a" stroke-width="2.5" marker-end="url(#arrow)"/><text x="526" y="555" text-anchor="middle" font-size="20" fill="#ab6565"><tspan x="526" dy="0">否</tspan></text><path d="M635 622 H985 V290 H975" fill="none" stroke="#61718a" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#arrow)"/><text x="500" y="725" text-anchor="middle" font-size="22" fill="#77511e"><tspan x="500" dy="0">设计示意：图中的独立产物检查与通知门控尚未在第三课实现。</tspan></text></g></svg>
