<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="830" viewBox="0 0 1000 830" role="img" aria-labelledby="title desc">
<title id="title">ReAct 循环与报告验收</title><desc id="desc">上下文支持模型决策，有工具请求时由 Python 执行并记录观察，再回到下一轮上下文；模型提出结束时检查实际报告，通过才结束，失败则报错。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#61718a"/></marker></defs>
<rect width="1000" height="830" fill="#ffffff"/><g font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif"><text x="500" y="45" text-anchor="middle" font-size="29" fill="#172b4d"><tspan x="500" dy="0">ReAct：决策 → 行动 → 观察 → 再决策</tspan></text><rect x="100" y="95" width="420" height="100" rx="14" fill="#eef4ff" stroke="#5577b2" stroke-width="2"/><text x="310" y="136" text-anchor="middle" font-size="23" fill="#172b4d"><tspan x="310" dy="0">本轮上下文</tspan><tspan x="310" dy="34">相对稳定前缀 + 当前任务轨迹</tspan></text><rect x="100" y="260" width="420" height="100" rx="14" fill="#eef4ff" stroke="#5577b2" stroke-width="2"/><text x="310" y="301" text-anchor="middle" font-size="23" fill="#172b4d"><tspan x="310" dy="0">model：模型决策</tspan><tspan x="310" dy="34">工具调用请求，或最终回复</tspan></text><rect x="100" y="435" width="420" height="100" rx="14" fill="#fff6e8" stroke="#b78942" stroke-width="2"/><text x="310" y="476" text-anchor="middle" font-size="23" fill="#172b4d"><tspan x="310" dy="0">tools：程序执行</tspan><tspan x="310" dy="34">读取 / Decimal 计算 / 写入</tspan></text><rect x="100" y="610" width="420" height="100" rx="14" fill="#edfaf4" stroke="#418269" stroke-width="2"/><text x="310" y="651" text-anchor="middle" font-size="23" fill="#172b4d"><tspan x="310" dy="0">observe：记录实际观察</tspan><tspan x="310" dy="34">工具结果进入历史，更新轨迹</tspan></text><rect x="665" y="260" width="300" height="100" rx="14" fill="#fff6e8" stroke="#b78942" stroke-width="2"/><text x="815" y="301" text-anchor="middle" font-size="23" fill="#172b4d"><tspan x="815" dy="0">verify：程序验收</tspan><tspan x="815" dy="34">检查真实报告及金额</tspan></text><rect x="665" y="455" width="300" height="100" rx="14" fill="#edfaf4" stroke="#418269" stroke-width="2"/><text x="815" y="496" text-anchor="middle" font-size="23" fill="#172b4d"><tspan x="815" dy="0">通过：记录验收并结束</tspan><tspan x="815" dy="34">失败：报错并保留日志</tspan></text><path d="M310 200 V250" fill="none" stroke="#61718a" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M310 365 V425" fill="none" stroke="#61718a" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M310 540 V600" fill="none" stroke="#61718a" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M95 660 H40 V145 H90" fill="none" stroke="#61718a" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M525 310 H655" fill="none" stroke="#61718a" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M815 365 V445" fill="none" stroke="#61718a" stroke-width="2.5" marker-end="url(#arrow)"/><text x="420" y="397" text-anchor="middle" font-size="20" fill="#52627a"><tspan x="420" dy="0">有工具请求</tspan></text><text x="590" y="285" text-anchor="middle" font-size="20" fill="#52627a"><tspan x="590" dy="0">请求结束</tspan></text><text x="420" y="573" text-anchor="middle" font-size="20" fill="#52627a"><tspan x="420" dy="0">执行后反馈</tspan></text><text x="500" y="780" text-anchor="middle" font-size="23" fill="#52627a"><tspan x="500" dy="0">本课记录公开消息与工具结果，不要求输出隐藏思维链。</tspan></text></g></svg>
